name: EstateIQ CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend CI (Django)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Configuration & System Check
        run: |
          cd backend
          python manage.py check

      - name: Security Audit Scan (Bandit)
        run: |
          pip install bandit
          bandit -r backend/ -ll -ii || true

      - name: Run Django Test Suite
        run: |
          cd backend
          python manage.py test

  ml-service-ci:
    name: ML Microservice CI (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Dependencies
        run: |
          cd ml-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt joblib pandas scikit-learn xgboost pytest httpx

      - name: Run ML Microservice Health Check Test
        run: |
          cd ml-service
          python -c "import main; print('ML Microservice imported successfully. Model loaded:', main.model_bundle is not None)"

  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Production Build Test
        run: |
          cd frontend
          VITE_API_URL=http://localhost:8000 npm run build
