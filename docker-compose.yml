version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: estateiq_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estateiq_db}
      POSTGRES_USER: ${POSTGRES_USER:-estateiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estateiq_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estateiq_user} -d ${POSTGRES_DB:-estateiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estateiq_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-estateiq_user}:${POSTGRES_PASSWORD:-estateiq_pass}@db:5432/${POSTGRES_DB:-estateiq_db}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-secret-key-estateiq-2026}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estateiq_frontend
    restart: always
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: estateiq_ml_service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ml-service:/app
    ports:
      - "8001:8001"

volumes:
  postgres_data:
